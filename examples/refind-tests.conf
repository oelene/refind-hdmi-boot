# Append temporarily to the ORIGINAL working rEFInd configuration.
# This file does not replace a complete refind.conf.
# Replace the placeholder with your ESP partition GUID first.

menuentry "HDMI color test" {
    volume <ESP_PARTITION_GUID>
    loader \EFI\gopdiag\target-output.efi
    graphics off
}

menuentry "HDMI menu test" {
    volume <ESP_PARTITION_GUID>
    loader \EFI\gopdiag\hdmi-menu.efi
    graphics off
}
