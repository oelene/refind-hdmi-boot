# EXAMPLE ONLY. Replace the ESP partition GUID and all OS-specific paths.
timeout 10
scanfor manual
default_selection "Windows 11"
showtools about, reboot, shutdown, firmware, exit
use_nvram false
resolution 1920 1080

menuentry "Windows 11" {
    icon \EFI\refind\icons\os_win.png
    volume <ESP_PARTITION_GUID>
    loader \EFI\Microsoft\Boot\bootmgfw.efi
    ostype Windows
}

menuentry "Windows VHD example" {
    icon \EFI\refind\icons\os_win.png
    volume <ESP_PARTITION_GUID>
    loader \EFI\Win10VHD\bootmgfw.efi
    ostype Windows
}

menuentry "Ubuntu vDisk example" {
    icon \EFI\refind\icons\os_ubuntu.png
    volume <ESP_PARTITION_GUID>
    loader \EFI\refind\vdiskchain
    options "vdisk=/ubuntu.vhd.vtoy"
}
